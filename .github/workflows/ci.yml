name: farmiq-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FarmIQ.sln

      - name: Build solution
        run: dotnet build FarmIQ.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/FarmIQ.Tests/FarmIQ.Tests.csproj --configuration Release --no-build

      - name: Build API image
        run: docker build -f src/FarmIQ.API/Dockerfile -t farmiq-api:ci .

      - name: Build Admin image
        run: docker build -f src/FarmIQ.Admin/Dockerfile -t farmiq-admin:ci .
